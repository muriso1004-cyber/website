name: Sync Naver blog properties

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update the public property feed
        run: node scripts/sync-naver-blog.mjs
      - name: Commit feed changes
        run: |
          if git diff --quiet -- assets/noryangjin-blog-properties.json assets/properties; then
            echo "No property changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/noryangjin-blog-properties.json assets/properties
          git commit -m "data: sync Naver blog properties"
          git push
